# The gateway plane: virtual keys, per-key token accounting, rate limits.
# Trajectories are Harbor's job. `harbor view jobs` reads the local run
# directory with no infrastructure, which is where teams actually iterate.

services:
  gateway:
    image: ghcr.io/berriai/litellm:main-stable
    ports:
      - "4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      # config.yaml names hooks.proxy_handler_instance as a callback, so the
      # module has to be beside it. Without this the proxy exits at startup with
      # "No module named 'hooks'" -- the deployed image copies both, and only the
      # local one had to be told.
      - ./hooks.py:/app/hooks.py:ro
      # Your own AWS credentials, so the local gateway signs for Bedrock the
      # same way the deployed one does with its task role. Read-only, and it
      # needs the SSO cache, so run `aws sso login` first.
      - ${HOME}/.aws:/root/.aws:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      AWS_PROFILE: ${AWS_PROFILE:-playground}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev}
      DATABASE_URL: postgresql://litellm:litellm@db:5432/litellm
    depends_on:
      db:
        condition: service_healthy

  # Virtual keys and their spend are rows in here. Without it LiteLLM answers
  # /key/generate with "DB not connected".
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
