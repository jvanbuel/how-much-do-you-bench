[project]
name = "hackathon-agent"
version = "0.1.0"
description = "Your agent. Change anything except the entrypoint contract."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.109.1",
]

# The one thing the benchmark harness relies on. Keep this line.
# It is invoked as: uv run agent --instruction "<task instruction>"
[project.scripts]
agent = "agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
