schema_version = "1.3"
artifacts = []

[task]
name = "hackathon/incremental-dupes"
description = "Fix an incremental dbt model that watermarks on the wrong column"
authors = []
keywords = ["dbt", "duckdb", "incremental", "data-engineering"]

[metadata]
category = "data-engineering"
difficulty_explanation = """
The bug is not visible in any single file. The agent has to run the pipeline,
compare fct_orders against the raw feed, and notice two opposite symptoms (a
duplicated order and a missing one) that share one root cause: the incremental
watermark is on updated_at, a property of the order, rather than ingested_at, a
property of the ingest.
"""

[verifier]
timeout_sec = 600.0
collect = []

[verifier.env]

[agent]
timeout_sec = 900.0

# ponytail: network_mode stays "public" because Harbor's docker egress control
# only engages on Linux hosts, and participants run these tasks on macOS
# laptops. Egress for *scored* runs is restricted on the Linux worker host
# instead, which covers the harness process too. Flip this to
# network_mode = "allowlist" if local runs ever stop needing to work on macOS.

[environment]
network_mode = "public"
build_timeout_sec = 900.0
os = "linux"
cpus = 2
memory_mb = 4096
mcp_servers = []

[environment.env]

[solution.env]
