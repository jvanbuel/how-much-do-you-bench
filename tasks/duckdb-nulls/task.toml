schema_version = "1.3"
artifacts = []

[task]
name = "hackathon/duckdb-nulls"
description = "Fix a report where NOT IN swallows every row and month() merges years"
authors = []
keywords = ["duckdb", "sql", "null-semantics", "data-engineering"]

[metadata]
category = "data-engineering"
difficulty_explanation = """
A monthly revenue report that runs, returns rows, and is wrong twice over.

`NOT IN` against a subquery that contains a NULL is never true for any row, so the
dormant-customer list comes back empty rather than short. And `month()` returns 1-12
with no year, so the same month from two years collapses into one bucket. Both bugs
produce output that looks like a report, which is why reading the numbers rather
than the SQL does not find them.
"""

[verifier]
timeout_sec = 600.0
collect = []

[verifier.env]

[agent]
timeout_sec = 900.0

# ponytail: network_mode stays "public" because Harbor's docker egress control
# only engages on Linux hosts, and participants run these tasks on macOS
# laptops. Egress for *scored* runs is restricted on the Linux worker host
# instead, which covers the harness process too. Flip this to
# network_mode = "allowlist" if local runs ever stop needing to work on macOS.

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
os = "linux"
cpus = 2
memory_mb = 4096
mcp_servers = []

[environment.env]

[solution.env]
