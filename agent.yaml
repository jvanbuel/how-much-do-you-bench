# Your harness configuration.
#
# This is the file to edit when you want a different harness, a skill, or an MCP
# server. It is Harbor's own JobConfig, so nothing here is a translation layer
# that can drift from what actually runs.
#
#   just eval           # run this config against a task
#   just show-config    # print what it resolves to, without running anything
#
# `agents` is a list. Adding a second entry runs both against the same task in
# the same command, which is the cheapest way to find out whether your careful
# context engineering actually beats an off-the-shelf harness.
#
# ---------------------------------------------------------------------------
# What a graded run does with this file
#
# The workers read it out of the commit you submit, so the harness you eval
# locally is the harness you are scored on. Three differences, all of them
# because a scored run is not your laptop:
#
#   * Only the FIRST entry under `agents:` is graded. Two agents in one scored
#     run would be two results competing for one row on the board. List several
#     while you are comparing; put the one you mean on top before you submit.
#   * Per-agent `name`, `import_path`, `model_name`, `skills`, `mcp_servers` and
#     `kwargs` are honoured. Anything else -- `mounts`, `env`, a task path -- is
#     the runner's, and a config that sets one is refused rather than obeyed.
#   * `skills:` paths are resolved inside your commit, so commit the directory.
#
# A config these rules refuse is rejected at `just submit`, with the reason,
# and does not spend one of your submissions. If grading still cannot use it
# (the check is best-effort), it falls back to running your own `agent/`
# entrypoint and says why on the board -- check there if you were scored on
# something you did not expect.

agents:
  - name: codex
    model_name: gemma
    skills: []
    mcp_servers: []
    # codex ships a built-in web_search tool, and Bedrock refuses any request
    # carrying one: "Tool type 'web_search' is not supported". It serves
    # function, mcp, custom, namespace and tool_search -- the hosted kinds would
    # have to run on the provider's own infrastructure.
    kwargs:
      web_search: disabled

  # Your own harness: the `agent/` directory in this repo, run as
  # `uv run agent --instruction ...`. Uncomment to grade your code instead.
  #
  # - name: custom
  #   import_path: harness.submission_agent:Submission
  #   model_name: gemma
  #   skills: []
  #   mcp_servers: []
  #   kwargs: {}

  # Claude Code works against this model as of the 2026-08-19 gateway. Until
  # then every request it sent was refused whole: its tool schemas carry
  # `propertyNames`, which this endpoint rejects, and the refusal arrived as an
  # opaque "Generation failed" on turn one. The gateway now strips that keyword
  # (ops/gateway/hooks.py), and it passes the canary. The earlier measurement --
  # 168 turns, 1.5M input tokens, $7.93 and the bug still there -- was a harness
  # arguing with a 400, so treat it as unmeasured rather than as slow.
  #
  # - name: claude-code
  #   model_name: gemma

  # Attaching skills and MCP servers looks like this, on any agent above.
  #
  # - name: mini-swe-agent
  #   model_name: gemma
  #   skills:
  #     # A local directory, or a git source like `org/repo@ref`.
  #     - ./skills/data-engineering
  #   mcp_servers:
  #     - name: duckdb
  #       transport: stdio
  #       command: uvx
  #       args: ["mcp-server-duckdb", "--db", "/app/warehouse.duckdb"]
  #   kwargs:
  #     max_turns: 40

  # Two harnesses need their model_name spelled a particular way, because
  # Harbor's adapter rewrites or validates it on the way through:
  #
  #   opencode  ->  openai/gemma    the adapter refuses a name with no provider
  #                                 prefix, and the refusal is a ValueError
  #                                 before the first model call
  #
  #   pi  ->  gateway/gemma   pi ignores OPENAI_BASE_URL entirely, so the base
  #                           image gives it a `gateway` provider in
  #                           ~/.pi/agent/models.json. That file points at the
  #                           deployed gateway, so pointing pi at a local one
  #                           means overriding it -- otherwise pi talks to the
  #                           deployed gateway and 401s on your local key.
  #
  # Measured on the full suite: opencode 8/21, codex 4/21.
  #
  # Everything known about each harness against this model -- spellings, env
  # vars, quirks, what the gateway silently does to requests -- is collected in
  # docs/harnesses.md. Read it before choosing one or debugging one.
  #
  # Harbor also ships adapters for aider, codex, copilot-cli, cursor-cli,
  # gemini-cli, goose, hermes, kimi-cli, langgraph, opencode, openhands,
  # qwen-code, swe-agent, terminus-2 and trae-agent.
